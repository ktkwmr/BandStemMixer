<!DOCTYPE html>
<!-- Source of public/bandstemmixer/og-image.png (1200x630). Regenerate with:
     node scripts/render-og-image.mjs -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #fff; color: #000;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { box-sizing: border-box; height: 100%; padding: 64px 88px; display: grid; grid-template-columns: 1fr 470px; gap: 56px; align-items: center; }
  .brand { display: flex; align-items: center; gap: 24px; margin-bottom: 36px; }
  .brand svg { width: 96px; height: 96px; }
  h1 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0 0 40px; font-size: 32px; color: #525252; line-height: 1.4; }
  .url { font-size: 26px; color: #737373; }
  .mixer { border: 2px solid #d4d4d4; border-radius: 20px; padding: 18px 26px; }
  .row { display: grid; grid-template-columns: 120px 40px 40px 1fr; gap: 12px; align-items: center; height: 96px; border-bottom: 2px solid #e5e5e5; font-size: 22px; font-weight: 700; }
  .row:last-child { border-bottom: 0; }
  .b { height: 36px; border: 2px solid #d4d4d4; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: "DejaVu Sans Mono", monospace; font-size: 18px; }
  .b.on { background: #000; color: #fff; border-color: #000; }
  .track { position: relative; height: 6px; border-radius: 3px; background: #e5e5e5; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; background: #000; border-radius: 3px; }
  .track i::after { content: ""; position: absolute; right: -11px; top: -8px; width: 22px; height: 22px; border-radius: 50%; background: #000; }
  .row.off { color: #a3a3a3; }
  .row.off .track i { background: #a3a3a3; }
  .row.off .track i::after { background: #a3a3a3; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="brand">
        <svg viewBox="0 0 28 28"><rect width="28" height="28" rx="7"/><g stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".45"><path d="M5.5 6v16M9 6v16M12.5 6v16M16 6v16M19.5 6v16M23 6v16"/></g><g fill="#fff"><rect x="4" y="15" width="3" height="2.6" rx=".8"/><rect x="7.5" y="9" width="3" height="2.6" rx=".8"/><rect x="11" y="17.5" width="3" height="2.6" rx=".8"/><rect x="14.5" y="11.5" width="3" height="2.6" rx=".8"/><rect x="18" y="7" width="3" height="2.6" rx=".8"/><rect x="21.5" y="13" width="3" height="2.6" rx=".8"/></g></svg>
        <h1>Band Stem<br />Mixer</h1>
      </div>
      <p>Split a song into vocals, drums, bass, and other with AI, and practice along.</p>
      <div class="url">ktkwmr.com/bandstemmixer</div>
    </div>
    <div class="mixer">
      <div class="row"><span>Vocals</span><span class="b">M</span><span class="b">S</span><span class="track"><i style="width:80%"></i></span></div>
      <div class="row off"><span>Bass</span><span class="b on">M</span><span class="b">S</span><span class="track"><i style="width:70%"></i></span></div>
      <div class="row"><span>Drums</span><span class="b">M</span><span class="b">S</span><span class="track"><i style="width:75%"></i></span></div>
      <div class="row"><span>Other</span><span class="b">M</span><span class="b">S</span><span class="track"><i style="width:60%"></i></span></div>
    </div>
  </div>
</body>
</html>
